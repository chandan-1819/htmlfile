<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 200px;
            width: 200px;
            background-color: aquamarine;
            transition-property: background;
            transition:3s ease-in-out;
            margin: 200px ;
            transition-duration: 5s ;
            border-radius:20px;
            /* transition-delay: 2s; */
        }
        .box:hover{
            background-color: rgb(154, 47, 47);
            width: 400px;
            /* transform: scale(1,2); */
            /* transform: rotate(270deg); */
            /* transform: translateY(100px); */
            transform: skew(70deg);
        }
    </style>
</head>
<body>
    <div class="box">&nbsp;Lorem ipsum, dolor sit amet consectetur adipisicing elit. Vitae, quo.

    </div>
    
</body>
</html>
